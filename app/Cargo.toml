[package]
name = "recorder-app"
version = "0.1.0"
edition = "2021"
description = "실시간 전사 화면 (GPUI + macOS 26 Native Liquid Glass). Python 백엔드(../backend.py)를 실행해 결과를 보여 준다"

[dependencies]
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.0"
objc = "0.2.7"
raw-window-handle = "0.6.2"
