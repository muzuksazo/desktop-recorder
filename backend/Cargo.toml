[package]
name = "asr-backend"
version = "0.1.0"
edition = "2021"
description = "WSL2 안에서 도는 전사 백엔드: Windows GUI에서 오디오를 받아 Qwen3-ASR 워커로 전사한다"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
